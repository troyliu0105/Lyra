name: Deploy Online

on:
  # release:
  #   types: [released]
  # 每 6 小时检查上游 DoL-Lyra/Lyra 的最新 release 并自动重建部署。
  # GitHub 仅在默认分支上调度定时 workflow；vega 是本仓默认分支。
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "强制重建（忽略与上次成功部署的指纹比较）"
        type: boolean
        default: false
  workflow_call:
    inputs:
      force:
        description: "强制重建（忽略与上次成功部署的指纹比较）"
        type: boolean
        default: false

# crazy-max/ghaction-github-pages 需要 contents: write 以强推 gh-pages。
# 本仓 Actions 权限已为 write，此处显式声明以满足组合调用场景。
permissions:
  contents: write

# 定时与手动触发可能并发，强制串行化以避免 gh-pages 推送竞争。
# 每次 deploy 是全量重建 (keep_history: false)，取消进行中的运行是安全的。
concurrency:
  group: pages-deploy
  cancel-in-progress: true

env:
  DOWNLOAD_RELEASE_TEMP_PATH: ${{ github.workspace }}/modloader-temp

  # 成功部署后写入 build_dir 根目录的指纹文件；下一次运行据此判断是否需要重建。
  DEPLOY_META_FILENAME: "deploy-meta.json"

  MODLOADER_HTML_NORMAL_FILENAME: "dol.html"
  MODLOADER_HTML_POLYFILL_FILENAME: "dol-polyfill.html"

  MANIFEST_JSON_NORMAL_FILENAME: "manifest-normal.json"
  MANIFEST_JSON_POLYFILL_FILENAME: "manifest-polyfill.json"

  UPLOAD_ARTIFACT_NAME: "ModLoader-Artifact"
  UPLOAD_ARTIFACT_FILEPATH: ${{ github.workspace }}/Modloader-Artifact.zip

jobs:
  # 先判断“上游产物 + 本仓注入逻辑”是否与上次成功部署一致；一致则跳过 build/deploy，
  # 避免每 6 小时重复全量重建并强推 gh-pages。
  precheck:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve upstream release
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 上游 DoL-Lyra/Lyra 的 release 时有时被标记为 prerelease、有时不是，
          # 且 fork 本身没有 release。这里显式按 published_at 取“最新发布”的 release
          # （不区分 prerelease），再用显式 tag 下载，避免依赖 release-downloader
          # 对 /releases/latest 与 prerelease 的取舍语义（latest:true 会跳过 prerelease）。
          # release_key 覆盖 tag 与资产清单（名称/摘要/更新时间）：上游重发同名资产也算变化。
          RELEASE_JSON=$(gh api "repos/DoL-Lyra/Lyra/releases?per_page=30" \
            --jq 'sort_by(.published_at) | reverse | .[0]')
          TAG=$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name // empty')
          if [ -z "$TAG" ]; then
            echo "::error::无法解析上游 DoL-Lyra/Lyra 的 release"
            exit 1
          fi
          RELEASE_KEY=$(printf '%s' "$RELEASE_JSON" \
            | jq -S -c '{tag: .tag_name, updated_at: .updated_at, assets: [.assets[] | {name, digest, updated_at}]}' \
            | sha256sum | cut -d' ' -f1)
          echo "resolved upstream tag: $TAG (release key: $RELEASE_KEY)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_key=$RELEASE_KEY" >> "$GITHUB_OUTPUT"

      - name: Compute build fingerprint
        id: fingerprint
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_KEY: ${{ steps.resolve.outputs.release_key }}
        run: |
          DOL_VER="${TAG#v}"
          DOL_VER="${DOL_VER%%-*}"
          # maplebirch 可为同一 DoL 版本重发 asset；用 asset 名 + updated_at 识别内容变化，
          # 否则同一 tag 下的扩展更新会被误判为“无变化”。
          MAPLEBIRCH_KEY=""
          if [[ "$DOL_VER" == 0.5.* ]]; then
            MAPLEBIRCH_KEY=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/MaplebirchLeaf/SCML-DOL-maplebirchFramework/releases/latest" \
              | DOL_VER="$DOL_VER" python3 -c "import sys,json,os; dv=os.environ['DOL_VER']; a=next((a for a in json.load(sys.stdin)['assets'] if f'-{dv}-' in a['name'] and a['name'].endswith('.mod.zip')), None); print(f\"{a['name']}@{a.get('updated_at','')}\" if a else '')")
          fi
          # 本仓影响发布内容的输入：workflow 自身（注入逻辑、扩展 URL）与 .github/pwa。
          INPUTS_HASH=$( { sha256sum .github/workflows/deploy.yaml; find .github/pwa -type f -print0 | sort -z | xargs -0 -r sha256sum; } | sha256sum | cut -d' ' -f1 )
          FP=$(printf '%s\n%s\n%s\n' "$RELEASE_KEY" "$MAPLEBIRCH_KEY" "$INPUTS_HASH" | sha256sum | cut -d' ' -f1)
          echo "fingerprint inputs: tag=$TAG release=$RELEASE_KEY maplebirch=${MAPLEBIRCH_KEY:-<none>} repo_inputs=$INPUTS_HASH"
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"

      - name: Compare with last successful deploy
        id: compare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
          FP: ${{ steps.fingerprint.outputs.fingerprint }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          # 指纹只在 deploy 成功后由 build 写入 gh-pages，并用 Contents API 读取
          # （避开 raw/CDN 缓存）。首次部署或 gh-pages 不存在时按“需要构建”处理。
          PREV_FP=""
          PREV_TAG=""
          if MARKER=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${DEPLOY_META_FILENAME}?ref=gh-pages" \
              -H "Accept: application/vnd.github.raw" 2>/dev/null); then
            PREV_FP=$(printf '%s' "$MARKER" | jq -r '.fingerprint // empty')
            PREV_TAG=$(printf '%s' "$MARKER" | jq -r '.tag // empty')
          fi

          CHANGED=true
          if [ "$FORCE" = "true" ]; then
            REASON="forced rebuild"
          elif [ -z "$PREV_FP" ]; then
            REASON="no previous successful deploy"
          elif [ "$PREV_FP" = "$FP" ]; then
            CHANGED=false
            REASON="fingerprint unchanged since $PREV_TAG"
          else
            REASON="fingerprint changed since $PREV_TAG"
          fi

          echo "changed=$CHANGED"
          echo "reason=$REASON"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploy precheck"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| upstream tag | \`$TAG\` |"
            echo "| fingerprint | \`$FP\` |"
            echo "| previous | \`${PREV_TAG:-none}\` / \`${PREV_FP:-none}\` |"
            echo "| decision | $([ "$CHANGED" = "true" ] && echo 'build' || echo 'skip') |"
            echo "| reason | $REASON |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CHANGED" = "false" ]; then
            echo "::notice::上游产物与部署逻辑均未变化（$PREV_TAG），跳过构建与发布"
          fi

  build:
    runs-on: ubuntu-latest
    needs: precheck
    if: needs.precheck.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Make Directories
        run: |
          mkdir -p "${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}"

      - id: getRelease
        name: release-downloader
        uses: robinraju/release-downloader@v1
        with:
          # Fork 仓库本身没有 release，从上游 DoL-Lyra/Lyra 拉取构建产物。
          repository: DoL-Lyra/Lyra
          tag: ${{ needs.precheck.outputs.tag }}
          fileName: "DoL-*-Lyra-*-goose-ucb-[0-9]*.zip"
      - id: getRelease-polyfill
        name: release-downloader
        uses: robinraju/release-downloader@v1
        with:
          # Fork 仓库本身没有 release，从上游 DoL-Lyra/Lyra 拉取构建产物。
          repository: DoL-Lyra/Lyra
          # 与 getRelease 使用同一 tag，保证两条轨道版本一致。
          tag: ${{ needs.precheck.outputs.tag }}
          # Polyfill (兼容模式) 固定为 besc 组合 (config/combinations.toml: polyfill.code=3)；
          # 上游不构建 polyfill-goose-ucb 产物，故 polyfill 轨道沿用 besc。
          fileName: "DoL-*-Lyra-*-polyfill-besc-*.zip"

      - name: Extract downloaded file
        run: |
          echo "Downloaded DoL: ${{ steps.getRelease.outputs.tag_name }}"
          # 将普通模式与兼容模式解压到各自子目录，避免 polyfill 的 besc 图片
          # 以 unzip -qo 覆写 normal 的 goose 图片（历史 bug：254 个 PNG 被损坏）。
          mkdir -p "${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}/normal"
          unzip -q ${{ fromJson(steps.getRelease.outputs.downloaded_files)[0] }} -d "${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}/normal"
          mv "${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}/normal/Degrees of Lewdity.html" "${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}/normal/dol.html"

          echo "Downloaded DoL Polyfill: ${{ steps.getRelease-polyfill.outputs.tag_name }}"
          mkdir -p "${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}/polyfill"
          unzip -q ${{ fromJson(steps.getRelease-polyfill.outputs.downloaded_files)[0] }} -d "${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}/polyfill"
          mv "${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}/polyfill/Degrees of Lewdity.html" "${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}/polyfill/dol-polyfill.html"
      - name: Extract DoL version
        id: dolVersion
        shell: python3 {0}
        run: |
          tag = "${{ steps.getRelease.outputs.tag_name }}"
          # tag format: v0.5.8.10-3.1.3a-0401
          dol_ver = tag.lstrip('v').split('-')[0]
          print(f"dol_ver={dol_ver}")
          import os
          gf = os.environ.get('GITHUB_OUTPUT', '')
          if gf:
              with open(gf, 'a') as f:
                  f.write(f"dol_ver={dol_ver}\n")
          ge = os.environ.get('GITHUB_ENV', '')
          if ge:
              with open(ge, 'a') as f:
                  f.write(f"dol_ver={dol_ver}\n")

      - name: Construct PWA
        run: |
          cp -r .github/pwa/* ${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}

      - name: Download extensions
        id: dlExt
        if: startsWith(steps.dolVersion.outputs.dol_ver, '0.5.')
        shell: bash
        run: |
          mkdir -p "${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}/extensions"
          # maplebirch 按 DoL 版本动态匹配 asset；上游为每个 DoL 版本发布专用构建。
          MAPLEBIRCH_URL=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/MaplebirchLeaf/SCML-DOL-maplebirchFramework/releases/latest" \
            | python3 -c "import sys,json,os; dv=os.environ['dol_ver']; print(next((a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if f'-{dv}-' in a['name'] and a['name'].endswith('.mod.zip')), ''))")
          if [ -n "$MAPLEBIRCH_URL" ]; then
            curl -fsSL -o "${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}/extensions/maplebirch.mod.zip" "$MAPLEBIRCH_URL"
          else
            echo "::warning::maplebirch 无 dol_ver=${dol_ver} 的专用 asset，跳过"
          fi
          # GuideToMe / DoLSims 的 asset 不区分 DoL 版本，直接用最新 tag。
          curl -fsSL -o "${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}/extensions/guidetome.mod.zip" "https://github.com/Ayndpa/DOL-GuideToMe/releases/download/1.1.0/GuideToMe.zip"
          curl -fsSL -o "${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}/extensions/dolsims.mod.zip" "https://github.com/MissedHeart/Degrees-of-Lewdity-DolSims/releases/download/v0.8.1.6.2/DoLSims.mod.zip"

      - name: Modify HTML
        shell: python3 {0}
        run: |
          import re, json, base64, os, pathlib
          ext_dir = "${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}/extensions"
          inject_ext = os.environ.get("dol_ver", "").startswith("0.5.") and os.path.isdir(ext_dir)
          ext_payloads = []
          if inject_ext:
              for p in sorted(pathlib.Path(ext_dir).glob("*.mod.zip")):
                  ext_payloads.append(base64.b64encode(p.read_bytes()).decode("ascii"))
          for html_name, manifest_name in zip(
            ["normal/${{ env.MODLOADER_HTML_NORMAL_FILENAME }}", "polyfill/${{ env.MODLOADER_HTML_POLYFILL_FILENAME }}"],
            ["${{ env.MANIFEST_JSON_NORMAL_FILENAME }}", "${{ env.MANIFEST_JSON_POLYFILL_FILENAME }}"]
          ):
            with open(f"${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}/{html_name}", "r+", encoding="utf-8") as index_html_file:
              index_html = index_html_file.read()
              # DoL HTML 实际为 <meta charset="UTF-8"> (无自闭合斜杠)；
              # 旧代码查找 '<meta charset="UTF-8" />' 会返回 -1 并把 manifest 注入到文件末尾，
              # 产生畸形 HTML。此处匹配真实标记并在缺失时立即报错，避免静默损坏。
              for marker in ('<meta charset="UTF-8">', '<meta charset="UTF-8" />'):
                  insert_index = index_html.find(marker)
                  if insert_index != -1:
                      break
              if insert_index == -1:
                  raise SystemExit(f"charset injection marker not found in {html_name}")
              index_html = index_html[:insert_index] + \
                  f"<link rel=\"manifest\" href=\"../{manifest_name}\">\n" + index_html[insert_index:]
              init_marker = '<body>\n\t<div id="init-screen">'
              init_found = index_html.find(init_marker)
              if init_found == -1:
                  raise SystemExit(f"init-screen injection marker not found in {html_name}")
              insert_index = init_found + 7
              index_html = index_html[:insert_index] + \
                  "    <script>\n" + \
                  "        if (typeof navigator.serviceWorker !== 'undefined') {\n" + \
                  "            navigator.serviceWorker.register('../sw.js')\n" + \
                  "        }\n" + \
                  "        // iOS ITP 会对未安装为 PWA 的站点在 7 天无访问后清除 localStorage；\n" + \
                  "        // SugarCube 存档全部存于 localStorage，请求持久化存储以降低被清风险。\n" + \
                  "        if (navigator.storage && navigator.storage.persist) {\n" + \
                  "            navigator.storage.persist().catch(function () {});\n" + \
                  "        }\n" + \
                  "    </script>\n" + index_html[insert_index:]
              if ext_payloads:
                  m = re.search(r"window\.modDataValueZipList\s*=\s*(\[.*?\]);", index_html, re.DOTALL)
                  if m:
                      existing_list = json.loads(m.group(1))
                      existing_list.extend(ext_payloads)
                      index_html = re.sub(
                          r"window\.modDataValueZipList\s*=\s*(\[.*?\]);",
                          f"window.modDataValueZipList = {json.dumps(existing_list)};",
                          index_html,
                          flags=re.DOTALL,
                      )
              index_html_file.seek(0)
              index_html_file.truncate()
              index_html_file.write(index_html)

      - name: Write deploy metadata
        run: |
          # 该文件随 artifact 一起发布到 gh-pages；precheck 读取它判断是否重复。
          # 只有 deploy 成功推送后才会更新，失败运行不会污染指纹。
          jq -n \
            --arg tag "${{ needs.precheck.outputs.tag }}" \
            --arg fingerprint "${{ needs.precheck.outputs.fingerprint }}" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg workflow_run "${{ github.run_id }}" \
            '{tag: $tag, fingerprint: $fingerprint, built_at: $built_at, workflow_run: $workflow_run}' \
            > "${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}/$DEPLOY_META_FILENAME"

      - name: Pack Artifact
        run: |
          7z a ${{ env.UPLOAD_ARTIFACT_FILEPATH }} ${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}/*

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.UPLOAD_ARTIFACT_NAME }}
          path: ${{ env.UPLOAD_ARTIFACT_FILEPATH }}

  # precheck 判定无变化时 build 被跳过，本 job 因 needs 未满足同样跳过，不会重复推送 gh-pages。
  deploy-github:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.UPLOAD_ARTIFACT_NAME }}

      - name: Extract Artifact
        working-directory: ${{ github.workspace }}
        run: |
          unzip -q ${{ env.UPLOAD_ARTIFACT_FILEPATH }} -d ./modloader-temp

      - name: Modify manifest.json
        shell: python3 {0}
        run: |
          import json
            
          for manifest_name in ["${{ env.MANIFEST_JSON_NORMAL_FILENAME }}", "${{ env.MANIFEST_JSON_POLYFILL_FILENAME }}"]:
            with open(f"${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}/{manifest_name}", "r+", encoding="utf-8") as manifest_file:
              manifest_json = json.loads(manifest_file.read())
              manifest_json["scope"] = "/${{ github.event.repository.name }}/"
              manifest_json["start_url"] = "/${{ github.event.repository.name }}/"
              manifest_json["shortcuts"][0]["url"] = "/${{ github.event.repository.name }}/"
              manifest_json["icons"][0]["src"] = "/${{ github.event.repository.name }}/icon.png"
              manifest_file.seek(0)
              manifest_file.truncate()
              manifest_file.write(json.dumps(manifest_json, indent=2))

      - name: Remove gitignore from img
        run: |
          # 上游 DoL zip 内 img/.gitignore 以 **/*.png 等规则忽略所有图片资源。
          # crazy-max/ghaction-github-pages 通过 git 提交，若不删除这些 .gitignore，
          # 所有图片都会被丢弃，线上站点只剩 HTML。普通/兼容模式各自位于子目录，
          # 需分别清理；同时兜底清理根目录的遗留 .gitignore。
          rm -f ./modloader-temp/normal/img/.gitignore
          rm -f ./modloader-temp/polyfill/img/.gitignore
          rm -f ./modloader-temp/img/.gitignore

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          repo: ${{ github.repository }}
          # https://github.com/Eltirosto/Degrees-of-Lewdity-Chinese-Localization/blob/e88b5f05a7e1c210edc80e9d6fb32716abd24e60/.github/workflows/main.yml#L120
          build_dir: ./modloader-temp
          keep_history: false
          target_branch: gh-pages
