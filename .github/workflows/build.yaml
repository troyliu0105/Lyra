name: Build

on:
  push:
    branches:
      - vega
    tags:
      - "*"
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".github/workflows/trigger.yaml"
      - ".github/workflows/deploy-hub.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-java@v5
        with:
          distribution: "adopt"
          java-version: "21"

      - name: Install APT packages
        run: sudo apt install -y unrar

      # 使用Python脚本处理游戏包
      - name: Prepare game packages
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            python scripts/ci.py prepare-package --workspace "${{ github.workspace }}" --tag "${{ github.ref_name }}" -v
          else
            python scripts/ci.py prepare-package --workspace "${{ github.workspace }}" -v
          fi

      - name: Setup signing key
        run: |
          echo ${{ secrets.SIGNING_KEY }} > dol.base64
          base64 -d dol.base64 > dol.jks

      # 并行构建所有组合
      - name: Build all combinations
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            python scripts/ci.py build-all-parallel --workspace "${{ github.workspace }}" --tag "${{ github.ref_name }}" --jobs 4 -v
          else
            python scripts/ci.py build-all-parallel --workspace "${{ github.workspace }}" --jobs 4 -v
          fi

      - name: List outputs
        run: ls -lah "${{ github.workspace }}/output/" || echo "No output files generated"

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dol-builds-zip
          path: ${{ github.workspace }}/output/*.zip

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dol-builds-apk
          path: ${{ github.workspace }}/output/*.apk

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: dol-builds-zip
          path: outputs/

      - uses: actions/download-artifact@v7
        with:
          name: dol-builds-apk
          path: outputs/

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: outputs/{*.zip,*.apk}
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
          make_latest: true
          release_name: ${{ github.ref_name }}

  deploy-download-page:
    runs-on: ubuntu-latest
    needs: release
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate download page
        run: |
          VERSION=${{ github.ref_name }}
          python scripts/ci.py generate-page --version "$VERSION" --output "$VERSION".md -v
          cat "$VERSION".md

      - name: Clone hub repository
        uses: actions/checkout@v6
        with:
          repository: DoL-Lyra/hub
          path: hub-repo

      - name: Copy download page to hub
        run: |
          VERSION=${{ github.ref_name }}
          FILENAME="${VERSION}.md"

          # 创建下载页面目录
          mkdir -p hub-repo/content/posts/downloads

          # 复制生成的 Markdown 文件
          cp "$VERSION".md hub-repo/content/posts/downloads/"$FILENAME"

          echo "Created: hub-repo/content/posts/downloads/$FILENAME"
          cat hub-repo/content/posts/downloads/"$FILENAME"

      - name: Push to hub repository
        run: |
          cd hub-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "${{ github.ref_name }}" || echo "No changes to commit"
          git push origin main

  call-deploy:
    uses: ./.github/workflows/deploy.yaml
    needs: release
    if: github.ref_type == 'tag'
    secrets: inherit

  call-deploy-hub:
    uses: DoL-Lyra/hub/.github/workflows/hub-deploy.yaml@main
    needs: release
    if: github.ref_type == 'tag'
    secrets: inherit
